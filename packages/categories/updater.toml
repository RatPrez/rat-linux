# Updater category: the `rat` CLI itself and its optional behaviors.
# "rat-cli" is handled by install/16-rat-cli.sh, which symlinks bin/rat onto
# PATH only if that item is selected. The "toggle" items aren't installed at
# all; bin/rat reads them live from the state file.
#
# Deselecting the whole category means bin/rat never gets symlinked, so the
# picker warns explicitly before letting it end up empty.

[[item]]
id = "rat-cli"
name = "rat CLI (rat update / rat patch-status)"
source = "script"
default = true

[[item]]
id = "flatpak-update"
name = "Include `flatpak update` in `rat update`"
source = "toggle"
default = true
