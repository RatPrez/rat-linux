# Extra apps category: optional VPN clients and office suite, on top of the
# ProtonVPN and LibreOffice that packages/pacman.txt installs unconditionally.
# Everything here defaults off.

[[item]]
id = "vesktop"
name = "Vesktop (Discord)"
description = "Vesktop is a customizable and privacy friendly Discord desktop app!"
source = "aur"
package = "vesktop"
default = true

[[item]]
id = "proton-vpn"
name = "Proton VPN"
description = "ProtonVPN client (GUI)"
source = "pacman"
package = "proton-vpn-gtk-app"
default = false

[[item]]
id = "mullvad"
name = "Mullvad VPN"
description = "WireGuard/OpenVPN client, in [extra]"
source = "pacman"
package = "mullvad-vpn"
default = false

[[item]]
id = "nymvpn"
name = "NymVPN"
description = "Mixnet VPN; pulls the nym-vpnd daemon in as a dependency"
source = "aur"
package = "nym-vpn-app"
default = false

[[item]]
id = "onlyoffice"
name = "OnlyOffice"
description = "MS Office-compatible suite"
source = "aur"
package = "onlyoffice-bin"
default = false

[[item]]
id = "libreoffice"
name = "LibreOffice"
description = "MS Office-compatible suite"
source = "pacman"
package = "libreoffice-still"
default = true
